spring.application.name=billingsoftware
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:billing_app}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:123456}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
server.servlet.context-path=

aws.access.key=${AWS_ACCESS:dummy_access}
aws.secret.key=${AWS_SECRET:dummy_secret}
aws.region=${AWS_REGION:us-east-1}
aws.bucket.name=${AWS_BUCKET_NAME:dummy_bucket}

jwt.secret.key=${JWT_SECRET:thisismysecretkeyfortheupcomingproject}

payos.client.id=${PAYOS_CLIENT:dummy_client}
payos.api.key=${PAYOS_API:dummy_api}
payos.checksum.key=${PAYOS_CHECKSUM:dummy_checksum}
logging.level.org.springframework.web=TRACE
logging.level.org.springframework.security=TRACE
